
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carne & Cinzas RPG</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>

    <!-- MENU PRINCIPAL -->
    <section id="inicio" class="tela">
      <h1>CARNE & CINZAS</h1>
      <p>Sobreviva ao fim do mundo.</p>

      <nav>
        <button data-destino="personagens">
          Criar Sobrevivente
        </button>

        <button data-destino="campanhas">
          Campanhas
        </button>

        <button data-destino="assentamentos">
          Assentamentos
        </button>
      </nav>
    </section>

   
<!-- CRIAÇÃO DE PERSONAGENS -->
<section id="personagens" class="tela escondido">
  <button class="voltar" type="button">← Voltar</button>

  <h2>Criar Sobrevivente</h2>
  <p>Todo sobrevivente tem uma história.</p>

  <form id="form-personagem">

    <div class="campo">
      <label for="nome">Nome do sobrevivente</label>
      <input
        type="text"
        id="nome"
        placeholder="Ex: Arthur Mendes"
        maxlength="60"
        required
      >
    </div>

    <div class="campo">
      <label for="idade">Idade</label>
      <input
        type="number"
        id="idade"
        placeholder="Ex: 32"
        min="0"
        max="120"
        required
      >
    </div>

    <div class="campo">
      <label for="descricao">Descrição</label>
      <textarea
        id="descricao"
        placeholder="Quem era você antes do fim do mundo?"
        rows="5"
        maxlength="1000"
      ></textarea>
    </div>

    <button type="submit" class="botao-principal">
      Continuar →
    </button>

  </form>

  <div id="resumo-personagem" class="escondido">
    <h3>Identidade registrada</h3>
    <p><strong>Nome:</strong> <span id="resumo-nome"></span></p>
    <p><strong>Idade:</strong> <span id="resumo-idade"></span></p>
    <p><strong>Descrição:</strong></p>
    <p id="resumo-descricao"></p>

    <button type="button" id="editar-personagem">
      Editar informações
    </button>
  </div>
</section>


    <!-- CAMPANHAS -->
    <section id="campanhas" class="tela escondido">
      <button class="voltar">← Voltar</button>

      <h2>Campanhas</h2>
      <p>Suas campanhas aparecerão aqui.</p>
    </section>

    <!-- ASSENTAMENTOS -->
    <section id="assentamentos" class="tela escondido">
      <button class="voltar">← Voltar</button>

      <h2>Assentamentos</h2>
      <p>Gerencie sua comunidade de sobreviventes.</p>
    </section>

  </main>
</body>
</html>
